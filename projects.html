<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Projects | ECZU Graphics</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <section class="all-projects">

        <div class="projects-header">
            <a href="index.html" class="back-btn">← Back to Home</a>

            <p>MY PORTFOLIO</p>
            <h1>All Projects</h1>

            <p class="projects-description">
                A collection of my graphic design works.
            </p>
            <div class="filter-buttons">

    <button class="filter-btn active" data-filter="all">
        ALL
    </button>

    <button class="filter-btn" data-filter="jersey">
        JERSEY
    </button>

    <button class="filter-btn" data-filter="logo">
        LOGO
    </button>

    <button class="filter-btn" data-filter="poster">
        POSTER
    </button>

    <button class="filter-btn" data-filter="social">
        SOCIAL MEDIA
    </button>

</div>

        </div>


        <div class="all-projects-grid">

            <div class="gallery-card" data-category="jersey">
                <img src="ARK Jersey Layout.png" alt="Jersey Design">
                <p>JERSEY DESIGN</p>
                <h3>Ascend Red Kings</h3>
            </div>

            <div class="gallery-card" data-category="logo">
                <img src="My Logo.jpg" alt="Logo Design">
                <p>LOGO DESIGN</p>
                <h3>Eczu Graphics</h3>
            </div>
            <div class="gallery-card" data-category="logo">
                <img src="Templars.jpg" alt="Logo Design">
                <p>LOGO DESIGN</p>
                <h3>Ancient Templars</h3>
            </div>

            <div class="gallery-card" data-category="logo">
                <img src="Stallions.jpg" alt="Logo Design">
                <p>LOGO DESIGN</p>
                <h3>Ancient Stallions</h3>
            </div>
            <div class="gallery-card" data-category="social">
                <img src="images/poster.jpg" alt="Tournament Poster">
                <p>SOCIAL MEDIA</p>

            </div>

            <div class="gallery-card" data-category="social">
                <img src="images/team-standing.jpg" alt="Team Standing">
                <p>GRAPHIC DESIGN</p>
                <h3>Team Standing</h3>
            </div>

        </div>

    </section>
<!-- IMAGE POPUP -->
<div id="imageModal" class="image-modal">

    <span class="close-modal">&times;</span>

    <button class="modal-prev">&#10094;</button>

    <img id="modalImage" src="" alt="Design Preview">

    <button class="modal-next">&#10095;</button>

</div>

<script>
    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    const closeModal = document.querySelector(".close-modal");

    const prevBtn = document.querySelector(".modal-prev");
    const nextBtn = document.querySelector(".modal-next");

    const images = document.querySelectorAll(".gallery-card img");

    let currentIndex = 0;

    // OPEN IMAGE
    images.forEach((image, index) => {

        image.addEventListener("click", function () {

            currentIndex = index;

            modalImage.src = this.src;

            modal.classList.add("active");

        });

    });

    // NEXT IMAGE
    nextBtn.addEventListener("click", function (event) {

        event.stopPropagation();

        currentIndex++;

        if (currentIndex >= images.length) {
            currentIndex = 0;
        }

        modalImage.src = images[currentIndex].src;

    });

    // PREVIOUS IMAGE
    prevBtn.addEventListener("click", function (event) {

        event.stopPropagation();

        currentIndex--;

        if (currentIndex < 0) {
            currentIndex = images.length - 1;
        }

        modalImage.src = images[currentIndex].src;

    });

    // CLOSE X
    closeModal.addEventListener("click", function () {
        modal.classList.remove("active");
    });

    // CLOSE WHEN CLICKING BACKGROUND
    modal.addEventListener("click", function (event) {

        if (event.target === modal) {
            modal.classList.remove("active");
        }

    });
</script>

<script>
    const filterButtons = document.querySelectorAll(".filter-btn");
    const galleryCards = document.querySelectorAll(".gallery-card");

    filterButtons.forEach(button => {

        button.addEventListener("click", function () {

            // Active button
            filterButtons.forEach(btn => {
                btn.classList.remove("active");
            });

            this.classList.add("active");

            const filter = this.getAttribute("data-filter");

            // Filter projects
            galleryCards.forEach(card => {

                const category = card.getAttribute("data-category");

                if (filter === "all" || category === filter) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }

            });

        });

    });
</script>



</body>
</html>
